<form id="loginForm" class="space-y-lg">
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="name">Full Name</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline group-focus-within:text-on-primary-container transition-colors" data-icon="person">person</span>
<input id="name"class="w-full pl-xl pr-md py-md bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-on-surface form-focus-glow transition-all" id="name" placeholder="Alexander Hamilton" type="text"/>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="email">Work Email</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline group-focus-within:text-on-primary-container transition-colors" data-icon="mail">mail</span>
<input id="email"class="w-full pl-xl pr-md py-md bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-on-surface form-focus-glow transition-all" id="email" placeholder="a.hamilton@luxestay.com" type="email"/>
</div>
</div>

<button class="w-full py-md px-lg bg-primary-container text-on-primary font-button text-button rounded-lg hover:bg-on-primary-fixed transition-all active:scale-[0.98] shadow-sm" type="submit">
                        Login to Dashboard
